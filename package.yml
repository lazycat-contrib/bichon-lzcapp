package: cloud.lazycat.app.bichon
version: 2.2.0
name: Bichon
description: Bichon – a lightweight, high-performance Rust email archiver with WebUI. Syncs IMAP mailboxes (incl. OAuth) into a local, searchable archive; receive-only, never sends. AGPL-3.0.
min_os_version: 1.5.0
homepage: https://github.com/rustmailer/bichon
author: rustmailer
license: AGPL-3.0
locales:
